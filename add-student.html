<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Student - Admin Panel - Saanvi</title>
  <link rel="stylesheet" href="portal.css">
  <style>
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      padding: 20px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 18px;
      color: #333;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: #999;
    }

    .modal-body {
      padding: 20px;
    }

    .modal-footer {
      padding: 20px;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }

    .form-control:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-outline {
      background: #f5f5f5;
      color: #333;
      border: 1px solid #e0e0e0;
    }

    .btn-outline:hover {
      background: #f0f0f0;
    }

    .alert {
      padding: 12px 15px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert-error {
      background: #ffebee;
      color: #c62828;
      border-left: 4px solid #c62828;
    }

    .alert-success {
      background: #e8f5e9;
      color: #2e7d32;
      border-left: 4px solid #2e7d32;
    }

    .hint {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }

    .loading {
      display: none;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="portal-page">

  <header class="portal-header">
    <div class="portal-logo">
      <img src="images/logo.jpg" alt="Logo" width="40" height="40">
      Admin Panel - Add Student
    </div>
    <div class="portal-nav">
      <a href="admin-dashboard.html" class="btn btn-outline">← Back</a>
    </div>
  </header>

  <main class="portal-main">
    <div class="dashboard-header">
      <div>
        <h1>Add New Student</h1>
        <p style="color: var(--portal-muted);">Create a new student account in the system</p>
      </div>
    </div>

    <div class="dashboard-grid">
      <div class="portal-card">
        <form id="addStudentForm">
          <div id="alertBox" class="alert"></div>

          <!-- Student Name -->
          <div class="form-group">
            <label class="form-label" for="studentName">Full Name *</label>
            <input 
              type="text" 
              id="studentName" 
              class="form-control" 
              placeholder="Enter student's full name" 
              required
            >
          </div>

          <!-- Class -->
          <div class="form-group">
            <label class="form-label" for="studentClass">Class *</label>
            <select id="studentClass" class="form-control" required>
              <option value="">-- Select Class --</option>
              <option value="Class 1">Class 1</option>
              <option value="Class 2">Class 2</option>
              <option value="Class 3">Class 3</option>
              <option value="Class 4">Class 4</option>
              <option value="Class 5">Class 5</option>
              <option value="Class 6">Class 6</option>
              <option value="Class 7">Class 7</option>
              <option value="Class 8">Class 8</option>
              <option value="Class 9">Class 9</option>
              <option value="Class 10">Class 10</option>
              <option value="Class 11">Class 11</option>
              <option value="Class 12">Class 12</option>
            </select>
          </div>

          <!-- Roll Number -->
          <div class="form-group">
            <label class="form-label" for="rollNumber">Roll Number</label>
            <input 
              type="text" 
              id="rollNumber" 
              class="form-control" 
              placeholder="e.g. 01, 02, etc"
            >
          </div>

          <!-- Parent Contact -->
          <div class="form-group">
            <label class="form-label" for="parentContact">Parent Contact (Optional)</label>
            <input 
              type="tel" 
              id="parentContact" 
              class="form-control" 
              placeholder="+91-9876543210"
            >
          </div>

          <!-- Passcode -->
          <div class="form-group">
            <label class="form-label" for="passcode">Initial Passcode *</label>
            <input 
              type="text" 
              id="passcode" 
              class="form-control" 
              value="1234"
              required
            >
            <div class="hint">4-digit passcode (student can change after first login)</div>
          </div>

          <!-- Submit Button -->
          <div style="display: flex; gap: 10px; margin-top: 30px;">
            <button type="button" class="btn btn-outline" onclick="window.history.back()">Cancel</button>
            <button type="submit" class="btn btn-primary" id="submitBtn">
              <span class="loading" id="loading">
                <span class="spinner"></span>Creating...
              </span>
              <span id="btnText">Create Student Account</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Firebase Scripts -->
  <script type="module">
    import { createStudent } from './firebase-student.js';

    const form = document.getElementById('addStudentForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(message, type = 'error') {
      alertBox.className = `alert show alert-${type}`;
      alertBox.textContent = message;
      alertBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('studentName').value.trim();
      const studentClass = document.getElementById('studentClass').value;
      const rollNumber = document.getElementById('rollNumber').value.trim();
      const parentContact = document.getElementById('parentContact').value.trim();
      const passcode = document.getElementById('passcode').value.trim();

      // Validation
      if (!name) {
        showAlert('Please enter student name');
        return;
      }

      if (!studentClass) {
        showAlert('Please select a class');
        return;
      }

      if (!passcode || passcode.length < 4) {
        showAlert('Passcode must be at least 4 characters');
        return;
      }

      // Show loading
      submitBtn.disabled = true;
      document.getElementById('loading').style.display = 'inline';
      document.getElementById('btnText').style.display = 'none';

      try {
        const studentId = await createStudent({
          name: name,
          class: studentClass,
          rollNumber: rollNumber,
          parentContact: parentContact,
          passcode: passcode
        });

        showAlert(`Student created successfully! ID: ${studentId}`, 'success');

        // Reset form
        form.reset();
        document.getElementById('passcode').value = '1234';

        // Redirect after 2 seconds
        setTimeout(() => {
          window.location.href = 'admin-dashboard.html';
        }, 2000);

      } catch (error) {
        console.error('Error creating student:', error);
        showAlert(error.message || 'Failed to create student. Please try again.');
        
        submitBtn.disabled = false;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('btnText').style.display = 'inline';
      }
    });
  </script>
</body>
</html>
